name: blast-radius (self)

on:
  pull_request:

# Self-test: listing PR files needs pull-requests: read, and the sticky
# comment needs pull-requests: write. The write scope posts the comment and
# nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    name: analyse this PR with itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Blast Radius on this PR
        id: blast
        uses: ./packages/action
        with:
          paths: '.'

      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: blast-radius-json
          path: blast-radius.json
          if-no-files-found: error

      - name: Assert a sane result
        run: |
          test -f blast-radius.json
          jq -e '.stats.files > 0' blast-radius.json
          jq -e '.reached | type == "array"' blast-radius.json

      - name: Assert sticky comment
        run: |
          count=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --jq '[.[] | select(.body | contains("<!-- blast-radius -->"))] | length')
          test "$count" = 1
        env:
          GH_TOKEN: ${{ github.token }}
